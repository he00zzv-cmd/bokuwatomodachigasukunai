이번에 제가 동아리를 하나 만들게 되어서 홍보 겸 부원 모집 글을 올립니다.

동아리 이름은 취미생활부이고 말 그대로 취미를 공유하는 동아리입니다,

저는 가능한 많은 분야에서 가능한 깊고 디테일한 취향을 갖고있는 사람이 객관적인 매력의 정의에 그나마 가장 가까운 것 같다고 생각합니다. 제가 모르는 지식이나 분야에 대한 관심도 만들어주고 제가 생각 못해본 영감을 주는 그런 사람이 성별 나이 관계없이 참 호감 가는 사람들인 것 같습니다. 그렇기 때문에 다른 사람들과 취미를 공유하거나 서로 관심 있는 분야에 대해서 이야기해보고자 이 동아리를 만들게 되었습니다. 

먼저 제가 현재 관심을 가지고 있거나 좋아하는 취미에 대해 간략하게 공유하겠습니다.

1. 스포츠
- 요즘은 F1을 좋아합니다. 레이스 보는 것을 좋아하고 자동차나 팀에 대한 이야기도 좋아합니다. 최애 선수는 막스 베르스타펜 형님, 차애는 카를로스 사인츠 형님입니다. 굿즈도 엄청 많이 모으고 최근에 마드리드 그랑프리에 직관을 갔다 왔습니다 😎
- 골프를 중학교 때까지 진로 탐색 목적으로 꽤 진지하게 배웠습니다. 
- 스키와 보드 둘 다 탈 줄 압니다. 최근에는 보드를 더 즐겨 탑니다.
- 축구와 야구는 직접 하는 것보다는 보는 것을 좋아합니다. 축구는 맨체스터 시티와 PSG를 좋아하고 야구는 어렸을때부터 시애틀 매리너스를 좋아합니다.

2. 요리

어렸을 때부터 음식에 관심이 많았습니다. 아버지께서 음식의 중요성을 많이 강조하셨고 어머니께서 요리를 잘하셔서 자연스럽게 관심이 생겼습니다. 맛있는 음식이라면 한두 시간 정도 기다리는 것도 크게 신경 쓰지 않는 편입니다. 먹는 것을 좋아하다 보니 직접 만드는 것에도 흥미가 생겼습니다.가장 관심 있는 요리는 고기 요리이고 존경하는 셰프는 고든 램지입니다. 개인적으로 주문제작한 제 이름이 각인된 칼도 가지고 있습니다. 

3. 사진

어렸을 때 아버지께서 사진 찍는 것을 좋아하셨습니다. 그 영향을 받아 언젠가 사진을 취미로 해보고 싶다고 생각했는데 마음에 드는 카메라를 발견해서 예상보다 일찍 시작하게 되었습니다. 사용하는 카메라는 Leica James Bond D-Lux 007인데 제가 좋아하는 007과 콜라보한 특별한 디자인의 카메라입니다. 사람의 눈으로 보는 것과 비슷한 사진을 찍는 것이 목표입니다.

4. 악기

기타를 어렸을 때부터 취미로 배우기 시작했다가 재미있어서 지금까지 계속하고 있습니다. 기타를 여러 대 가지고 있는데 몇몇만 소개를 해보자면
- 통통이
- 제인 (유일한 여자입니다.)
- 잭
- 하디
- 관심이
- 야마자키 긴
- 라울
등등 또 여행을 갈때 가지고 다니는 기타 등이 있습니다.

기타 피크는 던롭 울텍스를 사용합니다. 피크를 자주 잃어버리는 편이라 여러 개 가지고 있어도 계속 사게 돼서 엄청 많아졌다는... 😅 앞으로 베이스 기타, 피아노, 드럼, 하모니카, 색소폰 등도 배워보고 싶다는 생각입니다.

5. 영화 및 애니메이션

007 시리즈를 좋아합니다. 모든 배우분들의 007을 좋아하지만 특히 다니엘 크레이그가 출연한 작품은 대부분 좋아합니다. 카지노 로얄과 스카이폴을 추천합니다. 

애니메이션은 다음 작품들을 봤거나 좋아합니다.
- 블루 자이언트
- 닥터 스톤
- 원피스
- 도쿄 구울
- 원펀맨
- 디지몬 어드벤처
- 테니스의 왕자
애니메이션을 좋아하시는 분이 있다면 같이 이야기하면 좋을 것 같습니다 🙏

6. 패션

패션은 다양한 방식으로 자신을 표현할 수 있는 방법이라고 생각해서 좋아합니다. 하나의 스타일만 고집하진 않지만 록시크 스타일을 좋아하고 특히 가죽 소재의 아이템을 좋아합니다. 목걸이, 체인, 귀걸이, 반지 같은 액세서리도 좋아합니다. 옷에 관해서는 재봉, 비율, 색감, 소재, 역사 등 여러 분야에 관심이 있습니다. 시간 날 때마다 공부하려고 합니다. 언젠가는 저만의 패션 브랜드를 만드는 것이 꿈입니다.

7. 음악

록을 좋아합니다. 밴드 오아시스의 노래를 즐겨 듣고 LP판도 모았었습니다. 그 외에도 글레이, 딥퍼플, 그린데이, 건즈앤로지스, 롤링 스톤즈, 본 조비, 메탈리카, 원오크락, 이글스 분들도 매우 좋아합니다. 다들 들어보시는 것을 추천드립니다 🤘

8. 음식

좋아하는 음식이나 간식도 적어보겠습니다. 꿀, 체리, 옥수수, 감자를 매우 좋아합니다. 평생 한 가지 음식만 먹어야 한다면 돼지국밥을 선택할 것 같습니다. 배달앱으로 소고기와 스테이크를 자주 시켜 먹는데 스테이크 굽기는 미디움 레어를 선호합니다. (배달은 미디움)

9. 언어

언어 공부하는 것을 좋아합니다. 일단 지금 할 수 있는 언어는 한국어, 영어, 일본어이고 현재 추가로 스페인어, 불어를 공부하는 중입니다. 사람들과 원활하게 대화하는 것을 목표로 열심히 배우고 있습니다.

제가 좋아하거나 관심 있는 분야는 이 정도입니다. 다른 어떤 취미를 가지고 계시든 모든 분들을 두 손 들고 환영합니다.

서로의 취미를 존중하면서 즐겁게 활동했으면 좋겠습니다.
