addEventListener('keydown',e=>{if(scr!=='pass')return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace'){pin=pin.slice(0,-1);dots()}});
/* ===== KAKAOTALK ===== */
function items(){const L=SC[S.step-1];return[
 {id:'jw',n:'정원',m:L.x,t:fk(L.m),u:S.read?0:1,av:AV(ROOMS.jw.c)},
 {a:'cp'},{n:'엄마',m:'ㅇㅋ',t:'오후 2:32',u:0,av:AV('#e8b4b8')},{a:'bm'},{a:'ms'},
 {id:'sh',n:'박성훈',m:'응',t:'어제',u:0,av:AV(ROOMS.sh.c)},{a:'ts'},{a:'ct'},
 {id:'jy',n:'심재윤',m:'누구세요?',t:'어제',u:0,av:AV(ROOMS.jy.c)}].map(o=>{if(!o.a)return o;const d=APPCH[o.a];return{n:d[0],m:d[1],s:d[2],t:d[3],u:1,av:`<div class="av" style="${d[4]}">${d[5]}</div>`}})}
function chats(){const l=items().filter(o=>o.n.includes(q));return l.length?l.map(o=>`<div class="ci${o.id?' k':''}" ${o.id?`data-act="room" data-id="${o.id}"`:''}>${o.av}<div class="cm"><b>${o.n}</b><p>${o.m}</p>${o.s?`<p class="s">${o.s}</p>`:''}</div><div class="cr"><span>${o.t}</span>${o.u?`<i>${o.u}</i>`:''}</div></div>`).join(''):'<div class="emp">검색 결과가 없습니다</div>'}
function listHTML(){const t=S.tab,names={friends:'친구',chat:'채팅',open:'오픈채팅',shop:'쇼핑',more:'더보기'};let b;
 if(t==='chat')b=`<div class="kh"><h1>채팅</h1><div class="ki">${sv(P.search)}${sv(P.plus)}</div></div><div class="sr"><input id="qs" placeholder="채팅방 이름, 참여자 검색" value="${q}"></div><div class="kb" id="cl">${chats()}</div>`;
 else if(t==='friends')b=`<div class="kh"><h1>친구</h1><div class="ki">${sv(P.search)}</div></div><div class="kb"><div class="ci">${AV('#b9bfc7')}<div class="cm"><b>종성</b></div></div><div style="padding:8px 18px;font-size:12px;color:#999;border-top:1px solid #f0f0f0">친구 4</div>${Object.values(ROOMS).map(r=>`<div class="ci">${AV(r.c)}<div class="cm"><b>${r.n}</b></div></div>`).join('').replace('정원</b>','정원</b>')}<div class="ci">${AV('#e8b4b8')}<div class="cm"><b>엄마</b></div></div></div>`;
 else b=`<div class="kh"><h1>${names[t]}</h1></div><div class="kb"><div class="emp">아직 준비되지 않은 탭이에요</div></div>`;
 const un=items().reduce((a,c)=>a+c.u,0);
 return b+`<div class="kt">${[['friends','친구'],['chat','채팅'],['open','오픈채팅'],['shop','쇼핑'],['more','더보기']].map(([i,n])=>`<div class="${S.tab===i?'on':''}" data-act="tab" data-t="${i}">${sv(P[i],24)}<span>${n}</span>${i==='chat'&&un?`<em>${un}</em>`:''}</div>`).join('')}</div>`}
function roomHTML(){const jw=S.room==='jw',R=ROOMS[S.room],ms=jw?SC.slice(0,S.step):[{w:'y',m:0,x:R.x}];
 const body=ms.map((m,i)=>{const p=ms[i-1],n=ms[i+1],f=!p||p.w!==m.w,l=!n||n.w!==m.w||n.m!==m.m,t=m.m&&l?`<div class="tt">${fk(m.m)}</div>`:'';
  if(m.w==='j'){const un=!ms.slice(i+1).some(z=>z.w==='y');return`<div class="rw me"><div class="side">${un?'<b class="un">1</b>':''}${t}</div><div class="bb">${m.x}</div></div>`}
  return`<div class="rw">${f?`<div class="av s" style="background:${R.c}"><svg viewBox="0 0 40 40"><circle cx="20" cy="16" r="7" fill="#fff"/><path d="M6 40c0-9 6-14 14-14s14 5 14 14z" fill="#fff"/></svg></div>`:'<div class="av s sp"></div>'}<div class="col">${f?`<div class="nm">${R.n}</div>`:''}<div class="line"><div class="bb">${m.x}</div>${t}</div></div></div>`}).join('');
 return`<div class="rh" style="color:#222"><span data-act="back" style="cursor:pointer">${sv(P.back,24)}</span><b>${R.n}</b>${sv(P.search,20)}${sv(P.menu,20)}</div><div class="kb"><div class="msgs"><div class="dp">${jw?'2026년 11월 2일 월요일':'2026년 11월 1일 일요일'}</div>${body}</div></div>
 <div class="ib"><span style="color:#777">${sv(P.plus,24)}</span><div class="inp"${jw?' data-act="inp"':''}>${jw?S.draft:''}</div><div class="snd${S.draft&&jw?' on':''}"${jw?' data-act="send"':''}>${sv(P.up,20)}</div></div>`}
function renderK(){const a=$('#app'),o=a.querySelector('.kb'),st=o?o.scrollTop:0,rm=S.view==='room',key=S.view+S.tab,same=a.dataset.v===key;a.dataset.v=key;
 a.classList.toggle('rm',rm);a.innerHTML=rm?roomHTML():listHTML();const b=a.querySelector('.kb');if(b)b.scrollTop=rm?b.scrollHeight:(same?st:0)}
function reply(){const n=SC[S.step];if(!n||n.w!=='y'){busy=false;return}busy=true;
 setTimeout(()=>{S.step++;S.min=Math.max(S.min,n.m);save();renderK();tick();reply()},900)}
function send(){const m=SC[S.step];if(busy||!m||m.w!=='j'||S.draft!==m.x)return;S.step++;S.draft='';S.min=m.m;if(S.step===SC.length)S.done=true;save();renderK();tick();reply()}
function tick(){$$('.clk').forEach(e=>e.textContent=f12(S.min))}
/* ===== ACTIONS ===== */
function act(a,el){const d=el.dataset;switch(a){
 case 'app':if(d.id==='kakao')openApp(null,el);else{el.classList.add('b');setTimeout(()=>el.classList.remove('b'),300)}break;
 case 'notif':if(scr==='lock'){pend='jw';setScr('pass')}else openApp('jw');break;
 case 'clr':S.nd=true;save();renderN();break;
 case 'fl':el.classList.toggle('on');break;
 case 'k':key(d.d);break;
 case 'pc':if(pin){pin=pin.slice(0,-1);dots()}else{pend=null;setScr('lock')}break;
 case 'hb':if(scr==='app'||scr==='sw')goHome();break;
 case 'tab':S.tab=d.t;save();renderK();break;
 case 'room':S.view='room';S.room=d.id;enter();save();renderK();break;
 case 'back':S.view='list';save();renderK();break;
 case 'inp':{const m=SC[S.step];if(S.room==='jw'&&!busy&&!S.draft&&m&&m.w==='j'){S.draft=m.x;save();renderK()}break}
 case 'send':send();break}}
document.addEventListener('click',e=>{if(drag){drag=0;return}const a=e.target.closest('[data-act]');if(a)act(a.dataset.act,a)},true);
document.addEventListener('input',e=>{if(e.target.id==='qs'){q=e.target.value;$('#cl').innerHTML=chats()}});
/* ===== GESTURES ===== */
const sc=$('#sc');
$('#lt').addEventListener('dblclick',()=>{wipe();location.reload()});
sc.addEventListener('pointerdown',e=>{const r=sc.getBoundingClientRect();sf=r.width/402;g={cx:e.clientX,cy:e.clientY,y:(e.clientY-r.top)/sf,t:Date.now(),el:e.target};drag=0});
addEventListener('pointerup',e=>{if(!g)return;const dx=(e.clientX-g.cx)/sf,dy=(e.clientY-g.cy)/sf,dt=Date.now()-g.t,sy=g.y,el=g.el;g=null;drag=Math.hypot(dx,dy)>10?1:0;
 if(el.closest&&el.closest('.nt')&&dx<-60&&Math.abs(dy)<40){S.nd=true;save();renderN();return}
 if(scr==='lock'&&dy<-60)return setScr('pass');
 if(nc&&dy<-60)return setNC(false);
 if(sy<50&&dy>60&&(scr==='home'||scr==='app'))return setNC(true);
 if(sy>840&&dy<-40){if(scr==='app')(dt<300||dy<-250)?goHome():openSW();else if(scr==='sw')goHome();else if(scr==='pass')setScr('lock');return}
 if(scr==='home'&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))return pg(dx<0?1:0);
 if(scr==='sw'&&!drag&&el.id==='sw')goHome()});
function fit(){sf=Math.min(innerWidth/450,innerHeight/930,1.25);$('#fr').style.transform=`scale(${sf})`}
addEventListener('resize',fit);fit();
/* ===== BOOT ===== */
renderK();renderN();tick();pg(S.page);setScr('lock');
if(SC[S.step]&&SC[S.step].w==='y')reply();
</script></body></html>
