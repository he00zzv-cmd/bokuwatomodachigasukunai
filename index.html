<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>iPhone 16 Pro Simulator</title>
<style>
:root{--W:402px;--H:874px;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--sep:rgba(60,60,67,.18)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#0b0b0d;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;color:#fff}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;border:0;outline:0;background:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#scaler{width:430px;height:902px;flex:none;position:relative;transform-origin:center center}
#frame{position:absolute;inset:0;border-radius:74px;padding:14px;background:linear-gradient(145deg,#8a8a90,#2c2c2f 35%,#55555a 70%,#2a2a2d);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 2px #1a1a1c}
#bezel{position:absolute;inset:5px;border-radius:69px;background:#000}
#screen{position:absolute;left:14px;top:14px;width:var(--W);height:var(--H);border-radius:56px;overflow:hidden;background:#000;touch-action:none;isolation:isolate}
.btn{position:absolute;background:linear-gradient(90deg,#3b3b3f,#6a6a70,#3b3b3f);border-radius:3px;width:5px}
#bPower{right:-4px;top:262px;height:104px;cursor:pointer}
#bAct{left:-4px;top:152px;height:30px}#bV1{left:-4px;top:212px;height:58px}#bV2{left:-4px;top:282px;height:58px}#bCam{right:-4px;top:420px;height:70px;opacity:.7}
body.bare #frame{background:none;padding:0;box-shadow:none}body.bare #bezel,body.bare .btn,body.bare #hint,body.bare #island{display:none}
body.bare #scaler{width:402px;height:874px}body.bare #screen{left:0;top:0;border-radius:0}
#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#777}
#screen>div{position:absolute}
#wall,#wallblur{inset:0;background:var(--wp) center/cover no-repeat}
#wall{z-index:0}
#home{inset:0;z-index:10;transition:transform .4s cubic-bezier(.2,.8,.2,1),filter .4s}
#home.behind{transform:scale(.9);filter:brightness(.7)}
#pages{display:flex;width:804px;height:100%}
.page{width:402px;height:100%;padding:62px 27px 0;position:relative}
.grid{display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;row-gap:24px}
.hi{display:flex;flex-direction:column;align-items:center;gap:6px;width:60px;cursor:pointer}
.hi span{font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;letter-spacing:-.1px}
.ic60{position:relative;width:60px;height:60px;transition:transform .15s}.hi:active .ic60{transform:scale(.92);filter:brightness(.8)}
.icn{overflow:hidden;position:relative;flex:none;box-shadow:0 0 0 .5px rgba(255,255,255,.12) inset}
.icn svg{width:60px;height:60px;display:block}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:14px;font-weight:600;display:none;align-items:center;justify-content:center;padding:0 6px;font-style:normal;z-index:2}
.glass{background:rgba(40,44,56,.42);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5)}
.widget{border-radius:24px;height:150px;margin-bottom:26px;padding:16px;display:flex;gap:14px}
.widget .wl{width:96px}.widget .wl b{display:block;font-size:12px;color:#ff6961;letter-spacing:.5px}.widget .wl .wd{font-size:52px;font-weight:300;line-height:1.05}.widget .wl small{font-size:13px;opacity:.7}
.widget .wr{flex:1;border-left:1px solid rgba(255,255,255,.15);padding-left:14px;font-size:13px;overflow:hidden}
.widget .wr div{margin-bottom:7px}.widget .wr i{display:inline-block;width:3px;height:26px;border-radius:2px;background:#ff9f0a;float:left;margin-right:8px}.widget .wr small{display:block;opacity:.65;font-size:12px}
#dots{left:0;right:0;bottom:122px;display:flex;justify-content:center;gap:9px;z-index:11}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}#dots i.on{background:#fff}
#dock{left:18px;right:18px;bottom:30px;height:96px;border-radius:38px;display:flex;justify-content:space-around;align-items:center;padding:0 10px;z-index:11}
#dock .hi span{display:none}
#apps{inset:0;z-index:20;pointer-events:none}#apps.abovelock{z-index:42}
.app{position:absolute;inset:0;background:#fff;color:#000;overflow:hidden;visibility:hidden;pointer-events:auto;font-size:17px}
.app.dark{background:#000;color:#fff}.app.grp{background:#f2f2f7}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:54px;background:inherit;transition:transform .38s cubic-bezier(.3,.8,.3,1)}
.sub{transform:translateX(100%);box-shadow:-8px 0 20px rgba(0,0,0,.08)}.pushed>.sub{transform:none}.pushed>.main{transform:translateX(-28%)}
.navbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--blue);font-size:17px}
.navbar .back,.navbar span{cursor:pointer}
.lt{font-size:34px;font-weight:700;padding:2px 16px 8px;flex:none}
.scroll{flex:1;overflow-y:auto;touch-action:pan-y;padding-bottom:44px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.searchbar{margin:0 16px 8px;height:36px;border-radius:10px;background:rgba(120,120,128,.14);display:flex;align-items:center;padding:0 10px;color:#8e8e93;font-size:17px;flex:none}
.dark .searchbar{background:rgba(120,120,128,.3)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;position:relative}
.row::after{content:'';position:absolute;left:68px;right:0;bottom:0;border-bottom:.5px solid var(--sep)}.dark .row::after{border-color:rgba(255,255,255,.15)}
.row:active{background:rgba(120,120,128,.15)}
.av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#fff;flex:none}.av.sm{width:34px;height:34px;font-size:15px}
.grow{flex:1;min-width:0}.rt{display:flex;justify-content:space-between;align-items:baseline}.rt small{color:#8e8e93;font-size:14px}
.sub2{color:#8e8e93;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.thr{height:64px;padding-top:0}.tt{display:flex;flex-direction:column;align-items:center;gap:2px;color:#000}.tt small{font-size:11px}
.bubbles{padding:10px 12px 10px;display:flex;flex-direction:column;gap:4px}
.b{max-width:75%;padding:8px 13px;border-radius:19px;font-size:17px;line-height:1.25;word-wrap:break-word;white-space:pre-wrap}
.b.me{align-self:flex-end;background:#0a84ff;color:#fff}.b.them{align-self:flex-start;background:#e9e9eb;color:#000}
.stamp{align-self:center;font-size:11px;color:#8e8e93;margin:8px 0 4px}
.inbar{flex:none;display:flex;gap:8px;padding:8px 12px 36px;align-items:center;border-top:.5px solid var(--sep);background:#fff}
.inbar input{flex:1;height:36px;border:1px solid #c8c8cc;border-radius:18px;padding:0 14px;color:#000;-webkit-user-select:text;user-select:text}
.inbar button{width:32px;height:32px;border-radius:50%;background:#0a84ff;color:#fff;font-size:18px;font-weight:700}
.card{background:#fff;border-radius:12px;margin:0 16px 22px;overflow:hidden}
.card .row{padding:11px 16px}.card .row::after{left:16px}.card .row:last-child::after{display:none}
.row .ricon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;color:#fff}
.row .val{color:#8e8e93}
.sw{width:51px;height:31px;border-radius:16px;background:#e9e9ea;position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}.sw.on{background:#34c759}.sw.on::after{left:22px}
.gh{padding:6px 32px 6px;font-size:13px;color:#6d6d72;text-transform:uppercase}
.tabbar{height:84px;flex:none;display:flex;justify-content:space-around;padding-top:8px;font-size:10px;border-top:.5px solid var(--sep);background:inherit}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8e8e93;cursor:pointer;width:80px}.tabbar div b{font-size:22px;font-weight:400}.tabbar .on{color:var(--blue)}
.yel{color:#e5a800!important}
/* lock */
#lock{inset:0;z-index:40;transition:transform .5s cubic-bezier(.3,.8,.2,1),opacity .4s;color:#fff}
#lock.up{transform:translateY(-100%);pointer-events:none}
#lock::before,#nc::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.05) 40%,rgba(0,0,0,.35));z-index:-1}
.lk-top{position:absolute;top:60px;left:0;right:0;text-align:center}
.lk-top svg{width:16px;height:22px;opacity:.85}
.lk-date{font-size:20px;font-weight:600;opacity:.85;margin-top:6px}
.lk-time{font-size:96px;font-weight:600;line-height:1;margin-top:2px;letter-spacing:-1px;font-variant-numeric:tabular-nums;background:linear-gradient(#fff,rgba(255,255,255,.75));-webkit-background-clip:text;background-clip:text;color:transparent}
.nlist{position:absolute;left:12px;right:12px;top:330px;display:flex;flex-direction:column;gap:8px}
.ntf{display:flex;gap:10px;padding:11px 13px;border-radius:22px;background:rgba(60,62,72,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);cursor:pointer;color:#fff}
.nb{flex:1;min-width:0}.nt{display:flex;justify-content:space-between;align-items:baseline}.nt b{font-size:15px}.nt small{font-size:12px;opacity:.6}.nx{font-size:14.5px;opacity:.9;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{text-align:center;font-size:13px;opacity:.7;margin-top:2px}
.empty{text-align:center;opacity:.65;font-size:16px;margin-top:40px}
.qbtn{position:absolute;bottom:56px;width:52px;height:52px;border-radius:50%;background:rgba(40,44,56,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.qbtn svg{width:24px;height:24px;fill:#fff}.qbtn.on{background:#fff}.qbtn.on svg{fill:#000}
#pass{inset:0;z-index:45;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(0,0,0,.35);backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px)}
#pass.on{opacity:1;pointer-events:auto}#pass.go{opacity:0}
.p-title{position:absolute;top:122px;left:0;right:0;text-align:center;font-size:20px;font-weight:500}
.p-dots{position:absolute;top:172px;left:0;right:0;display:flex;justify-content:center;gap:18px}
.p-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}.p-dots i.f{background:#fff}
.p-dots.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-14px)}35%{transform:translateX(12px)}55%{transform:translateX(-9px)}75%{transform:translateX(6px)}}
.pad{position:absolute;top:238px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,80px);gap:14px 22px}
.k{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .12s}
.k:active{background:rgba(255,255,255,.55)}.k b{font-size:36px;font-weight:300;line-height:1}.k small{font-size:10px;letter-spacing:2px;font-weight:600;height:11px}
.k.t{background:none;font-size:17px}.k.t:active{background:none;opacity:.5}
/* nc, cc */
#nc{inset:0;z-index:50;transform:translateY(-102%);transition:transform .45s cubic-bezier(.3,.8,.2,1);background:rgba(10,12,20,.55);backdrop-filter:blur(36px);-webkit-backdrop-filter:blur(36px);color:#fff}
#nc.on{transform:none}
#nc .lk-top{top:56px}#nc .lk-time{font-size:64px}#nc .nlist{top:200px;bottom:60px;overflow:hidden}
.clr{align-self:flex-end;padding:7px 14px;border-radius:16px;background:rgba(120,120,128,.4);font-size:14px;cursor:pointer;margin-bottom:2px}
#cc{inset:0;z-index:55;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(0,0,0,.45);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
#cc.on{opacity:1;pointer-events:auto}
.cc-grid{position:absolute;top:70px;left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;transform:scale(.9);transition:transform .35s}
#cc.on .cc-grid{transform:none}
.cc-t{background:rgba(120,120,128,.38);border-radius:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.cc-conn{grid-column:span 2;grid-row:span 2;height:150px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;background:rgba(120,120,128,.38);border-radius:28px}
.cc-c{border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}.cc-c.on{background:#0a84ff}.cc-c.g.on{background:#30d158}.cc-c.o.on{background:#ff9f0a}
.cc-s{height:72px;font-size:26px}.cc-t.on{background:#fff;color:#000}
.cc-slide{height:160px;position:relative;overflow:hidden;border-radius:26px;background:rgba(120,120,128,.38);touch-action:none}
.cc-slide i{position:absolute;left:0;right:0;bottom:0;background:#fff}.cc-slide em{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-style:normal;font-size:24px;mix-blend-mode:difference;color:#fff}
.cc-wide{grid-column:span 4;height:70px;font-size:17px;gap:10px;display:flex}
/* switcher */
#sw{inset:0;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;background:rgba(0,0,0,.35);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
#sw.on{opacity:1;pointer-events:auto}
#swscroll{position:absolute;left:0;right:0;top:110px;height:600px;overflow-x:auto;overflow-y:visible;display:flex;gap:26px;padding:0 90px;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:none}#swscroll::-webkit-scrollbar{display:none}
.sc{flex:none;width:221px;scroll-snap-align:center;position:relative;transition:transform .3s,opacity .3s}
.sc .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;font-weight:600}
.sc .cv{width:221px;height:481px;border-radius:26px;overflow:hidden;position:relative;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.sc .scl{position:absolute;left:0;top:0;width:402px;height:874px;transform:scale(.55);transform-origin:0 0;pointer-events:none}
.sc .scl .app{visibility:visible!important;transform:none!important;clip-path:none!important}
.noapps{position:absolute;top:360px;left:0;right:0;text-align:center;font-size:20px;opacity:.7}
/* chrome */
#sb{left:0;right:0;top:0;height:54px;z-index:60;pointer-events:none;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 50px;color:#fff;transition:color .25s}
#sb.dk{color:#000}#sb.locked #sbTime{visibility:hidden}
#sbTime{font-size:17px;font-weight:600;width:70px;text-align:center;margin-left:-14px}
#sbR{display:flex;gap:6px;align-items:center;fill:currentColor}#sbR .net{font-size:13px;font-weight:600}
#island{top:11px;left:50%;margin-left:-62px;width:124px;height:36px;border-radius:20px;background:#000;z-index:61;transition:width .3s,height .3s,margin .3s}
#island.ban{width:360px;margin-left:-180px;height:44px;top:8px}
#zl,#zr,#hz{z-index:70}#zl{left:0;top:0;width:50%;height:36px}#zr{right:0;top:0;width:50%;height:36px}
#hz{left:0;right:0;bottom:0;height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer}
#hz i{width:140px;height:5px;border-radius:3px;background:#fff;opacity:.95;transition:background .25s}#hz.dk i{background:#000}
#dim{inset:0;z-index:80;background:#000;opacity:0;pointer-events:none}
#off{inset:0;z-index:90;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}#off.on{opacity:1;pointer-events:auto}
#banner{left:10px;right:10px;top:8px;z-index:62;border-radius:30px;padding:10px 14px;transform:translateY(-140px);transition:transform .45s cubic-bezier(.3,.8,.2,1)}#banner.on{transform:translateY(54px)}
#flash{inset:0;background:#fff;z-index:75;opacity:0;pointer-events:none}
/* misc apps */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 14px 40px}
.calc button{height:82px;border-radius:41px;background:#333;font-size:34px;color:#fff;cursor:pointer}.calc button:active{filter:brightness(1.5)}
.calc .f{background:#a5a5a5;color:#000}.calc .o{background:#ff9f0a;font-size:40px}.calc .z{grid-column:span 2;text-align:left;padding-left:32px}
.cdisp{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;font-size:84px;font-weight:300;padding:0 28px 6px;white-space:nowrap;overflow:hidden}
.gcal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:0 8px;row-gap:4px}
.gcal i{font-style:normal;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;cursor:pointer;position:relative}
.gcal i.h{height:24px;font-size:12px;color:#8e8e93;cursor:default}.gcal i.t b{background:#ff3b30;color:#fff}.gcal i.s b{background:#000;color:#fff}.gcal i.t.s b{background:#ff3b30}
.gcal i b{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:400}.gcal i u{position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:#8e8e93}
.ev{display:flex;gap:10px;padding:10px 16px;border-top:.5px solid var(--sep)}.ev i{width:4px;border-radius:2px;background:#ff9f0a}.ev small{display:block;color:#8e8e93}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.pt{aspect-ratio:1;background-size:cover;background-position:center;cursor:pointer}
.big{flex:1;background-size:contain;background-repeat:no-repeat;background-position:center}
.dial{display:grid;grid-template-columns:repeat(3,78px);gap:14px 24px;justify-content:center}
.dial div{width:78px;height:78px;border-radius:50%;background:#e9e9eb;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#000}.dial div:active{background:#c8c8cc}.dial b{font-size:32px;font-weight:400;line-height:1}.dial small{font-size:9px;letter-spacing:2px;font-weight:600;height:10px}
.call{background:#30d158!important;color:#fff!important;font-size:30px}
.pp{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.25);position:relative}.pp i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff}
.sticky{background:#ffd60a;color:#000}
textarea.ed{flex:1;width:100%;padding:8px 18px 60px;font-size:17px;line-height:1.35;resize:none;color:#000;background:#fff;-webkit-user-select:text;user-select:text}
.dark .row small{color:#8e8e93}
.mono{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:4px 10px;border-radius:12px;background:rgba(120,120,128,.18);font-size:13px}
</style>
</head>
<body>
<div id="stage">
 <div id="scaler">
  <div id="frame"><div id="bezel"></div></div>
  <div class="btn" id="bAct"></div><div class="btn" id="bV1"></div><div class="btn" id="bV2"></div><div class="btn" id="bPower" title="Side button (sleep / wake)"></div><div class="btn" id="bCam"></div>
  <div id="screen">
   <div id="wall"></div>
   <div id="home"><div id="pages"></div></div>
   <div id="dots"></div>
   <div id="dock" class="glass"></div>
   <div id="apps"></div>
   <div id="sw"><div id="swscroll"></div></div>
   <div id="lock">
    <div class="lk-top"><svg viewBox="0 0 16 22" fill="#fff"><rect x="0" y="9" width="16" height="13" rx="3"/><path d="M3.5 10V6.5a4.5 4.5 0 0 1 9 0V10" fill="none" stroke="#fff" stroke-width="2"/></svg><div class="lk-date" id="lkDate"></div><div class="lk-time" id="lkTime"></div></div>
    <div class="nlist" id="lkList"></div>
    <div class="qbtn" id="qFlash" style="left:46px"><svg viewBox="0 0 24 24"><path d="M7 2h10v4l-2 3v13H9V9L7 6z"/></svg></div>
    <div class="qbtn" id="qCam" style="right:46px"><svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 5.5A4.5 4.5 0 1 1 7.500 13 4.500 4.500 0 0 1 12 8.500z"/></svg></div>

/* generic gesture helper (coordinates in screen px) */
function gesture(el,o){
  let st=null;
  el.addEventListener('pointerdown',e=>{ if(o.filter&&!o.filter(e))return; st={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,id:e.pointerId}; o.start&&o.start(e,st); });

/* ---------- app lifecycle ---------- */
function ensureApp(id){
  if(appEls[id])return appEls[id];
  const a=APPS[id], el=E(`<div class="app ${a.dark?'dark':''} ${a.grp?'grp':''}" data-id="${id}"></div>`);
  appsL.appendChild(el); appEls[id]=el; inst[id]=a.init(el)||{}; return el;
}
function iconRect(id){
  const dockIcon=$(`#dock .hi[data-app="${id}"] .icn`);
  if(dockIcon&&!swOn)return relRect(dockIcon);
  const pi=DATA.layout.pages.findIndex(p=>p.includes(id)); if(pi<0)return null;
  if(pi!==page)setPage(pi,false);
  const e=$(`.page .hi[data-app="${id}"] .icn`); return e?relRect(e):null;
}
function animateOpen(el,r){
  const s=r.width/402, tr='transform .45s cubic-bezier(.2,.85,.2,1),clip-path .45s cubic-bezier(.2,.85,.2,1),opacity .2s';
  el.style.transition='none'; el.style.transformOrigin='0 0'; el.style.visibility='visible';
  el.style.transform=`translate(${r.left}px,${r.top-236*s}px) scale(${s})`; el.style.clipPath='inset(236px 0 236px 0 round 90px)';
  void el.offsetWidth; el.style.transition=tr; el.style.transform='none'; el.style.clipPath='inset(0 0 0 0 round 56px)';
  setTimeout(()=>{el.style.transition='';el.style.clipPath=''},480);
}
function animateCard(el,r){
  const s=r.width/402;
  el.style.transition='none'; el.style.transformOrigin='0 0'; el.style.visibility='visible';
  el.style.transform=`translate(${r.left}px,${r.top}px) scale(${s})`; el.style.clipPath='inset(0 0 0 0 round 60px)';
  void el.offsetWidth; el.style.transition='transform .42s cubic-bezier(.2,.85,.2,1),clip-path .42s'; el.style.transform='none'; el.style.clipPath='inset(0 0 0 0 round 56px)';
  setTimeout(()=>{el.style.transition='';el.style.clipPath=''},460);
}
function animateFade(el){
  el.style.transition='none'; el.style.transformOrigin='50% 50%'; el.style.visibility='visible'; el.style.opacity=0; el.style.transform='scale(.92)';
  void el.offsetWidth; el.style.transition='transform .35s cubic-bezier(.2,.85,.2,1),opacity .3s'; el.style.opacity=1; el.style.transform='none';
  setTimeout(()=>{el.style.transition=''},380);
}
function animateClose(el,r,done){
  el.style.transformOrigin='0 0'; el.style.transition='none';
  if(!el.style.transform||el.style.transform==='none')el.style.transform='translate(0,0) scale(1)';
  el.style.clipPath='inset(0 0 0 0 round 56px)'; void el.offsetWidth;
  if(r){const s=r.width/402; el.style.transition='transform .42s cubic-bezier(.3,.7,.2,1),clip-path .42s cubic-bezier(.3,.7,.2,1)'; el.style.transform=`translate(${r.left}px,${r.top-236*s}px) scale(${s})`; el.style.clipPath='inset(236px 0 236px 0 round 90px)';}
  else{el.style.transition='transform .35s,opacity .3s'; el.style.transform='scale(.85)'; el.style.opacity=0;}
  setTimeout(()=>{el.style.visibility='hidden';el.style.transition='none';el.style.transform='';el.style.clipPath='';el.style.opacity='';done&&done()},r?440:360);
}
function openApp(id,o={}){
  if(!APPS[id]||(locked&&id!=='camera'))return;
  closeOverlays(true);
  const el=ensureApp(id);
  if(current&&current!==id){ const prev=appEls[current]; prev.style.visibility='hidden'; }
  const wasCurrent=current===id; current=id; running=[id,...running.filter(x=>x!==id)];
  $$('.app',appsL).forEach(a=>a.style.zIndex=''); el.style.zIndex=2;
  if(o.route&&inst[id].route)inst[id].route(o.route);
  home.classList.add('behind'); setBars();
  if(wasCurrent&&!o.force){ el.style.visibility='visible'; return; }
  if(o.card)animateCard(el,o.card);
  else{ const r=o.rect===undefined&&!o.noRect?iconRect(id):o.rect; r?animateOpen(el,r):animateFade(el); }
}
function goHome(){
  if(locked&&current==='camera'&&appsL.classList.contains('abovelock')){
    const el=appEls.camera; current=null; appsL.classList.remove('abovelock'); animateClose(el,null); setBars(); return;
  }
  if(swOn){ closeSwitcher(); setBars(); return; }
  if(ncOn||ccOn){ closeOverlays(); return; }
  if(!current){ setPage(0); return; }
  const id=current, el=appEls[id]; current=null;
  const r=iconRect(id); home.classList.remove('behind'); setBars(); animateClose(el,r);
}
function removeApp(id){
  running=running.filter(x=>x!==id); const el=appEls[id]; if(el)el.remove(); delete appEls[id]; delete inst[id]; if(current===id)current=null;
}

/* ---------- app switcher ---------- */
function openSwitcher(){
  if(locked)return; closeOverlays(true);
  if(current){ const el=appEls[current]; el.style.transition='none';el.style.transform='';el.style.visibility='hidden'; current=null; }
  home.classList.remove('behind'); swOn=true; buildSwitcher(); sw.classList.add('on'); setBars();
}
function closeSwitcher(){ swOn=false; sw.classList.remove('on'); setBars(); }
function buildSwitcher(){
  const box=$('#swscroll'); box.innerHTML='';
  if(!running.length){ box.innerHTML='<div class="noapps">No Recent Apps</div>'; setTimeout(()=>{if(swOn&&!running.length)closeSwitcher()},900); return; }
  running.forEach(id=>{
    const clone=appEls[id].cloneNode(true); clone.style.cssText='';
    const c=E(`<div class="sc" data-id="${id}"><div class="ch">${iconHTML(id,28)}<span>${APPS[id].name}</span></div><div class="cv"><div class="scl"></div></div></div>`);
    $('.scl',c).appendChild(clone); box.appendChild(c);
    let dragEl=null;
    gesture(c,{
      start:()=>{dragEl=c;c.style.transition='none'},
      move:(dx,dy)=>{ if(Math.abs(dy)>Math.abs(dx)&&dy<0){c.style.transform=`translateY(${dy}px)`;c.style.opacity=1+dy/500} },
      end:(dx,dy,dt,s)=>{
        c.style.transition='transform .3s,opacity .3s';
        if(dy<-110||(dy<-40&&-dy/dt>.5)){ c.style.transform='translateY(-700px)';c.style.opacity=0; setTimeout(()=>{removeApp(id);c.remove(); if(!running.length)buildSwitcher()},280); }
        else{ c.style.transform='';c.style.opacity=1; if(!s.moved){ const r=relRect($('.cv',c)); closeSwitcher(); openApp(id,{card:r,force:true}); } }
      }
    });

}

/* ---------- overlays ---------- */
function closeOverlays(quick){

/* ---------- home indicator gesture ---------- */
gesture(hz,{
  move:(dx,dy)=>{ if(current&&dy<0&&!locked){const el=appEls[current]; el.style.transition='none'; el.style.transformOrigin='50% 100%'; el.style.transform=`translateY(${dy/3}px) scale(${clamp(1+dy/1200,.78,1)})`; el.style.borderRadius='40px';} },
  end:(dx,dy,dt,s)=>{
    const el=current&&appEls[current]; if(el){el.style.transition='transform .25s';el.style.transform='';el.style.borderRadius=''; el.style.transformOrigin='0 0'}
    if(locked){ if(passOn){ return; } if(dy<-40){showPass()} return; }

  const draw=()=>{ $('.tl',root).textContent=tab==='w'?'World Clock':'Stopwatch'; $$('.tabbar div',root).forEach(d=>{d.classList.toggle('on',d.dataset.t===tab);d.style.color=d.dataset.t===tab?'#ff9f0a':''}); tab==='w'?drawW():drawS(); };

APPS.calculator={name:'Calculator',sb:'light',dark:true,init(root){
  root.innerHTML=`<div class="pane main"><div class="cdisp">0</div><div class="calc">${[['AC','f'],['±','f'],['%','f'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['0','z'],['.'],['=','o']].map(([k,c])=>`<button class="${c||''}" data-k="${k}">${k}</button>`).join('')}</div></div>`;
  let cur='0',acc=null,op=null,fresh=true; const disp=$('.cdisp',root);
  const show=()=>{let s=cur; if(!s.includes('e')){const [a,b]=s.split('.'); s=(+a).toLocaleString('en-US')+(b!==undefined?'.'+b:''); if(cur.startsWith('-0')&&+a===0)s='-'+s;} disp.textContent=s; disp.style.fontSize=s.length>9?'52px':s.length>6?'68px':'84px'; };
  const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):b;
  const fmt=n=>isNaN(n)?'Error':String(+n.toPrecision(9));
  root.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; const k=b.dataset.k;
    if(/\d/.test(k)){ cur=fresh?k:(cur==='0'?k:cur+k); fresh=false; }
    else if(k==='.'){ if(fresh){cur='0.';fresh=false} else if(!cur.includes('.'))cur+='.'; }
    else if(k==='AC'){cur='0';acc=null;op=null;fresh=true}
    else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):(cur==='0'?'0':'-'+cur)}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100)}
    else if(k==='='){ if(op!==null&&acc!==null){cur=fmt(calc(acc,parseFloat(cur),op));acc=null;op=null;fresh=true} }
    else { if(op!==null&&acc!==null&&!fresh){cur=fmt(calc(acc,parseFloat(cur),op))} acc=parseFloat(cur); op=k; fresh=true; }
    show(); });
  show();
}};

   <div class="card"><div class="row" data-open="reset"><div class="grow" style="color:#ff3b30;text-align:center">Reset Simulator Data…</div></div></div>`; };

APPS.music={name:'Music',sb:'light',dark:true,init(root){
  const P=panes(root,`<div class="lt" style="padding-top:12px">Library</div><div class="scroll ml"></div><div class="mini" style="display:none;position:absolute;left:10px;right:10px;bottom:46px;height:58px;border-radius:16px;background:rgba(60,60,64,.95);align-items:center;gap:12px;padding:0 12px;cursor:pointer"></div>`); popOnBack(root);
  let idx=0,play=false,pos=0,loaded=false; const ml=$('.ml',root),mini=$('.mini',root);
  ml.innerHTML=DATA.songs.map((s,i)=>`<div class="row" data-i="${i}"><div style="width:52px;height:52px;border-radius:8px;background:${s.c};flex:none"></div><div class="grow"><b>${s.t}</b><div class="sub2">${s.a}</div></div><span class="val" style="color:#8e8e93">${Math.floor(s.len/60)}:${p2(s.len%60)}</span></div>`).join('');
  const drawMini=()=>{ const s=DATA.songs[idx]; mini.style.display=loaded?'flex':'none'; mini.innerHTML=`<div style="width:42px;height:42px;border-radius:8px;background:${s.c}"></div><div class="grow"><b style="font-size:15px">${s.t}</b></div><div class="mp" style="font-size:22px;width:40px;text-align:center">${play?'❚❚':'▶'}</div>`; };
  const drawNow=()=>{ const s=DATA.songs[idx]; const n=$('.now',P.sub); if(!n)return; $('.np-i',n).style.width=(pos/s.len*100)+'%'; $('.np-t',n).textContent=Math.floor(pos/60)+':'+p2(pos%60); $('.np-r',n).textContent='-'+Math.floor((s.len-pos)/60)+':'+p2((s.len-pos)%60); $('.pl',n).textContent=play?'❚❚':'▶'; };
  const openNow=()=>{ const s=DATA.songs[idx]; P.push(`<div class="now" style="display:flex;flex-direction:column;height:100%;padding:0 30px 50px;background:linear-gradient(#3a3a40,#000)"><div class="back" style="padding:14px 0 6px;color:#8e8e93;text-align:center;font-size:24px">⌄</div><div style="width:100%;aspect-ratio:1;border-radius:14px;background:${s.c};box-shadow:0 20px 40px rgba(0,0,0,.5);margin-top:14px"></div><div style="margin-top:34px"><div style="font-size:22px;font-weight:700">${s.t}</div><div style="color:#ff6a7a;font-size:20px">${s.a}</div></div><div style="margin-top:26px"><div class="pp"><i class="np-i"></i></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#8e8e93;margin-top:6px"><span class="np-t"></span><span class="np-r"></span></div></div><div style="display:flex;justify-content:space-around;align-items:center;font-size:36px;margin-top:20px"><span class="prev" style="cursor:pointer">⏮</span><span class="pl" style="font-size:52px;cursor:pointer"></span><span class="next" style="cursor:pointer">⏭</span></div></div>`); P.sub.style.background='#000'; drawNow(); };
  const load=i=>{ idx=(i+DATA.songs.length)%DATA.songs.length; pos=0; play=true; loaded=true; drawMini(); drawNow(); };
  ml.addEventListener('click',e=>{ const r=e.target.closest('.row'); if(!r)return; load(+r.dataset.i); openNow(); });
  mini.addEventListener('click',e=>{ if(e.target.closest('.mp')){play=!play;drawMini();return} openNow(); });
  P.sub.addEventListener('click',e=>{ if(e.target.closest('.pl')){play=!play;drawNow();drawMini()} if(e.target.closest('.next')){load(idx+1);openNowRefresh()} if(e.target.closest('.prev')){load(idx-1);openNowRefresh()} });
  function openNowRefresh(){ const s=DATA.songs[idx]; const n=$('.now',P.sub); if(n){ n.innerHTML=''; root.classList.remove('pushed'); setTimeout(()=>openNow(),10); } }
  onTick(()=>{ if(!root.isConnected)return false; if(play){ pos++; if(pos>=DATA.songs[idx].len){load(idx+1)} drawNow(); } });
}};

  const draw=()=>{ $('.tl',root).textContent=tab==='r'?'Recents':''; $$('.tabbar div',root).forEach(d=>d.classList.toggle('on',d.dataset.t===tab)); tab==='r'?drawR():drawK(); };
  root.addEventListener('click',e=>{ const t=e.target.closest('.tabbar div'); if(t){tab=t.dataset.t;draw();return} const k=e.target.closest('[data-k]'); if(k){ const v=k.dataset.k; if(v==='del')num=num.slice(0,-1); else if(v==='call'){ if(!num)return; $('.cn',root).textContent=num; $('.calling',root).style.display='block'; return } else if(num.length<15)num+=v; $('.nm',root).textContent=num; } if(e.target.closest('.end'))$('.calling',root).style.display='none'; });
  draw();
}};
